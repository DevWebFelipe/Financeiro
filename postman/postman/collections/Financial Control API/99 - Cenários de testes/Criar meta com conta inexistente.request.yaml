$kind: http-request
description: accountId inexistente. Conta de outro usuário também retorna 404.
url: "{{baseUrl}}/api/v1/financial-goals"
method: POST
body:
  type: json
  content: "{\r\n  \"accountId\": \"00000000-0000-0000-0000-000000000000\",\r\n  \"name\": \"Conta inválida\",\r\n  \"targetAmount\": 100.00\r\n}"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r\n\r\npm.test(\"Status deve ser 404 Not Found\", function () {\r\n    pm.response.to.have.status(404);\r\n});\r\n\r\npm.test(\"Código de erro deve ser NOT_FOUND\", function () {\r\n    pm.expect(json.code).to.eql(\"NOT_FOUND\");\r\n});\r"
    language: text/javascript
order: 8000
