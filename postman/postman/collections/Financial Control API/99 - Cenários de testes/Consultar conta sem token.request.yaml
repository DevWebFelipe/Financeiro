$kind: http-request
url: "{{baseUrl}}/api/v1/accounts"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 401 Unauthorized\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Erro deve possuir o formato oficial\", function () {\r

      \    pm.expect(json.timestamp).to.exist;\r

      \    pm.expect(json.status).to.exist;\r

      \    pm.expect(json.code).to.exist;\r

      \    pm.expect(json.message).to.exist;\r

      \    pm.expect(json.path).to.exist;\r

      });\r

      \r

      pm.test(\"Código de erro deve ser UNAUTHORIZED\", function () {\r

      \    pm.expect(json.code).to.eql(\"UNAUTHORIZED\");\r

      });\r"
    language: text/javascript
order: 2000
