$kind: http-request
url: "{{baseUrl}}/api/v1/credit-cards/{{creditCardId}}/limit"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Deve possuir creditLimit\", function () {\r

      \    pm.expect(json.creditLimit).to.exist;\r

      });\r

      pm.test(\"Deve possuir usedLimit\", function () {\r

      \    pm.expect(json.usedLimit).to.exist;\r

      });\r

      pm.test(\"Deve possuir availableLimit\", function () {\r

      \    pm.expect(json.availableLimit).to.exist;\r

      });\r"
    language: text/javascript
order: 5000
