$kind: http-request
url: "{{baseUrl}}/api/v1/credit-cards/{{creditCardId}}"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"ID do cartão deve corresponder ao solicitado\", function () {\r

      \    pm.expect(json.id).to.eql(pm.environment.get(\"creditCardId\"));\r

      });\r

      \r

      pm.test(\"Cartão deve possuir nome\", function () {\r

      \    pm.expect(json.name).to.exist;\r

      });\r

      pm.test(\"Cartão deve possuir titular\", function () {\r

      \    pm.expect(json.holderName).to.exist;\r

      });\r

      pm.test(\"Cartão deve possuir limite\", function () {\r

      \    pm.expect(json.creditLimit).to.exist;\r

      });\r"
    language: text/javascript
order: 2000
