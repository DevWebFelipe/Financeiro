$kind: http-request
url: "{{baseUrl}}/api/v1/credit-cards/{{creditCardId}}/deactivate"
method: POST
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Cartão deve estar desativado\", function () {\r

      \    pm.expect(json.active).to.be.false;\r

      });\r"
    language: text/javascript
order: 9000
