$kind: http-request
url: "{{baseUrl}}/api/v1/accounts/{{accountId}}"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"ID da conta deve corresponder ao solicitado\", function () {\r

      \    pm.expect(json.id).to.eql(pm.environment.get(\"accountId\"));\r

      });\r

      pm.test(\"Conta deve possuir nome\", function () {\r

      \    pm.expect(json.name).to.exist;\r

      });\r

      pm.test(\"Conta deve possuir tipo\", function () {\r

      \    pm.expect(json.type).to.exist;\r

      });\r"
    language: text/javascript
order: 2000
