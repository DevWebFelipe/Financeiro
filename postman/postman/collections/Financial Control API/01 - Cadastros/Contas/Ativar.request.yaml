$kind: http-request
url: "{{baseUrl}}/api/v1/accounts/{{accountId}}/activate"
method: POST
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Conta deve estar ativa\", function () {\r

      \    pm.expect(json.active).to.be.true;\r

      });\r"
    language: text/javascript
order: 7000
