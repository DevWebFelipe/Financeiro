$kind: http-request
description: Pagamento de despesa ACCOUNT/NONE. Pagamento de fatura não usa este recurso.
url: "{{baseUrl}}/api/v1/payments/{{paymentId}}"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"ID do pagamento deve corresponder ao solicitado\", function () {\r

      \    pm.expect(json.id).to.eql(pm.environment.get(\"paymentId\"));\r

      });\r

      pm.test(\"Pagamento deve possuir expenseId\", function () {\r

      \    pm.expect(json.expenseId).to.exist;\r

      });\r

      pm.test(\"Pagamento deve possuir status\", function () {\r

      \    pm.expect(json.status).to.exist;\r

      });\r

      pm.test(\"Pagamento deve possuir amount\", function () {\r

      \    pm.expect(json.amount).to.exist;\r

      });\r"
    language: text/javascript
order: 1000
