$kind: http-request
url: "{{baseUrl}}/api/v1/expenses/{{expenseId}}"
method: PUT
body:
  type: json
  content: "{\r

    \  \"categoryId\": \"{{expenseCategoryId}}\",\r

    \  \"description\": \"Conta de luz revisada\",\r

    \  \"totalAmount\": 80.00,\r

    \  \"expenseDate\": \"{{today}}\",\r

    \  \"dueDate\": \"{{today}}\",\r

    \  \"paymentMethod\": \"ACCOUNT\",\r

    \  \"accountId\": \"{{accountId}}\",\r

    \  \"responsibleType\": \"MINE\"\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"ID da despesa deve corresponder ao solicitado\", function () {\r

      \    pm.expect(json.id).to.eql(pm.environment.get(\"expenseId\"));\r

      });\r

      pm.test(\"Despesa deve possuir descrição\", function () {\r

      \    pm.expect(json.description).to.exist;\r

      });\r"
    language: text/javascript
order: 4000
