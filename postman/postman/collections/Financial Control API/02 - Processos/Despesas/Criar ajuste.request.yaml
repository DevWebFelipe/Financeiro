$kind: http-request
url: "{{baseUrl}}/api/v1/expenses/{{expenseId}}/installments/{{installmentId}}/adjustments"
method: POST
body:
  type: json
  content: "{\r

    \  \"type\": \"DISCOUNT\",\r

    \  \"amount\": 5.00,\r

    \  \"reason\": \"Desconto de teste\"\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 201 Created\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      if (json.id) {\r

      \    pm.environment.set(\"adjustmentId\", json.id);\r

      }\r

      \r

      pm.test(\"Ajuste deve possuir ID\", function () {\r

      \    pm.expect(json.id).to.exist;\r

      });\r

      pm.test(\"Status inicial deve ser ACTIVE\", function () {\r

      \    pm.expect(json.status).to.eql(\"ACTIVE\");\r

      });\r

      pm.test(\"Ajuste deve possuir type\", function () {\r

      \    pm.expect(json.type).to.exist;\r

      });\r

      pm.test(\"Ajuste deve possuir reason\", function () {\r

      \    pm.expect(json.reason).to.exist;\r

      });\r"
    language: text/javascript
order: 9000
