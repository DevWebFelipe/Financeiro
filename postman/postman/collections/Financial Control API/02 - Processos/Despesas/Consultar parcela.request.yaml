$kind: http-request
url: "{{baseUrl}}/api/v1/expenses/{{expenseId}}/installments/{{installmentId}}"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"ID da parcela deve corresponder ao solicitado\", function () {\r

      \    pm.expect(json.id).to.eql(pm.environment.get(\"installmentId\"));\r

      });\r

      pm.test(\"expenseId deve corresponder à despesa\", function () {\r

      \    pm.expect(json.expenseId).to.eql(pm.environment.get(\"expenseId\"));\r

      });\r

      pm.test(\"Parcela deve possuir amount\", function () {\r

      \    pm.expect(json.amount).to.exist;\r

      });\r

      pm.test(\"Parcela deve possuir remainingAmount\", function () {\r

      \    pm.expect(json.remainingAmount).to.exist;\r

      });\r

      pm.test(\"Parcela deve possuir status\", function () {\r

      \    pm.expect(json.status).to.exist;\r

      });\r"
    language: text/javascript
order: 6000
