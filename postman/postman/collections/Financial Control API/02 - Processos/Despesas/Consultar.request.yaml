$kind: http-request
url: "{{baseUrl}}/api/v1/expenses/{{expenseId}}"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"ID da despesa deve corresponder ao solicitado\", function () {\r

      \    pm.expect(json.id).to.eql(pm.environment.get(\"expenseId\"));\r

      });\r

      pm.test(\"Despesa deve possuir status\", function () {\r

      \    pm.expect(json.status).to.exist;\r

      });\r

      pm.test(\"Despesa deve possuir totalAmount\", function () {\r

      \    pm.expect(json.totalAmount).to.exist;\r

      });\r

      pm.test(\"Despesa deve possuir paymentMethod\", function () {\r

      \    pm.expect(json.paymentMethod).to.exist;\r

      });\r"
    language: text/javascript
order: 2000
