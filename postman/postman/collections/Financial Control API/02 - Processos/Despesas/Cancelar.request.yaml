$kind: http-request
description: Somente despesa OPEN. PARTIALLY_PAID e PAID usam Refundar.
url: "{{baseUrl}}/api/v1/expenses/{{expenseId}}/cancel"
method: POST
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Status deve ser CANCELLED\", function () {\r

      \    pm.expect(json.status).to.eql(\"CANCELLED\");\r

      });\r"
    language: text/javascript
order: 13000
