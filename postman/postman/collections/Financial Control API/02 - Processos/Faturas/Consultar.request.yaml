$kind: http-request
url: "{{baseUrl}}/api/v1/invoices/{{invoiceId}}"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"ID da fatura deve corresponder ao solicitado\", function () {\r

      \    pm.expect(json.id).to.eql(pm.environment.get(\"invoiceId\"));\r

      });\r

      pm.test(\"Fatura deve possuir status\", function () {\r

      \    pm.expect(json.status).to.exist;\r

      });\r

      pm.test(\"Fatura deve possuir totalAmount derivado\", function () {\r

      \    pm.expect(json.totalAmount).to.exist;\r

      });\r

      pm.test(\"Fatura deve possuir paidAmount derivado\", function () {\r

      \    pm.expect(json.paidAmount).to.exist;\r

      });\r

      pm.test(\"Fatura deve possuir remainingAmount derivado\", function () {\r

      \    pm.expect(json.remainingAmount).to.exist;\r

      });\r"
    language: text/javascript
order: 3000
