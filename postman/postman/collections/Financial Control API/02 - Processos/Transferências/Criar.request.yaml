$kind: http-request
description: "Origem e destino: BANK_ACCOUNT ativas, distintas. Requer {{destinationAccountId}} (crie duas contas e execute Listar em Contas)."
url: "{{baseUrl}}/api/v1/transfers"
method: POST
body:
  type: json
  content: "{\r

    \  \"sourceAccountId\": \"{{accountId}}\",\r

    \  \"destinationAccountId\": \"{{destinationAccountId}}\",\r

    \  \"amount\": 100.00,\r

    \  \"transferDate\": \"{{today}}\",\r

    \  \"description\": \"Transferência de teste\"\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 201 Created\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      if (json.id) {\r

      \    pm.environment.set(\"transferId\", json.id);\r

      }\r

      \r

      pm.test(\"Transferência deve possuir ID\", function () {\r

      \    pm.expect(json.id).to.exist;\r

      });\r

      pm.test(\"Status inicial deve ser ACTIVE\", function () {\r

      \    pm.expect(json.status).to.eql(\"ACTIVE\");\r

      });\r

      pm.test(\"Transferência deve possuir amount\", function () {\r

      \    pm.expect(json.amount).to.exist;\r

      });\r"
    language: text/javascript
order: 3000
