$kind: http-request
url: "{{baseUrl}}/api/v1/transfers/{{transferId}}"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"ID da transferência deve corresponder ao solicitado\", function () {\r

      \    pm.expect(json.id).to.eql(pm.environment.get(\"transferId\"));\r

      });\r

      pm.test(\"Transferência deve possuir origem\", function () {\r

      \    pm.expect(json.sourceAccountId).to.exist;\r

      });\r

      pm.test(\"Transferência deve possuir destino\", function () {\r

      \    pm.expect(json.destinationAccountId).to.exist;\r

      });\r

      pm.test(\"Transferência deve possuir amount\", function () {\r

      \    pm.expect(json.amount).to.exist;\r

      });\r

      pm.test(\"Transferência deve possuir status\", function () {\r

      \    pm.expect(json.status).to.exist;\r

      });\r"
    language: text/javascript
order: 2000
