$kind: http-request
url: "{{baseUrl}}/api/v1/invoices/{{invoiceId}}/agreements"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Resposta deve ser uma lista\", function () {\r

      \    pm.expect(json).to.be.an(\"array\");\r

      });\r

      \r

      if (Array.isArray(json) && json.length > 0) {\r

      \    pm.environment.set(\"agreementId\", json[0].id);\r

      \    if (json[0].installments && json[0].installments.length > 0) {\r

      \        pm.environment.set(\"agreementInstallmentId\", json[0].installments[0].id);\r

      \    }\r

      }\r"
    language: text/javascript
order: 3000
