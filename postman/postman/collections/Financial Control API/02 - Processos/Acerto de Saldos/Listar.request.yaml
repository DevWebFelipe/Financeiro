$kind: http-request
url: "{{baseUrl}}/api/v1/accounts/{{accountId}}/balance-adjustments"
method: GET
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Resposta deve ser uma lista\", function () {\r

      \    pm.expect(json).to.be.an(\"array\");\r

      });\r"
    language: text/javascript
order: 1000
