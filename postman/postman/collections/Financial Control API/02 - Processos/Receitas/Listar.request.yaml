$kind: http-request
url: "{{baseUrl}}/api/v1/incomes?page=0&size=20"
method: GET
queryParams:
  - key: startDate
    value: ""
    disabled: true
  - key: endDate
    value: ""
    disabled: true
  - key: status
    value: ""
    disabled: true
  - key: categoryId
    value: "{{incomeCategoryId}}"
    disabled: true
  - key: accountId
    value: "{{accountId}}"
    disabled: true
  - key: page
    value: "0"
  - key: size
    value: "20"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Resposta deve possuir items\", function () {\r

      \    pm.expect(json.items).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Resposta deve possuir paginação\", function () {\r

      \    pm.expect(json.page).to.exist;\r

      \    pm.expect(json.size).to.exist;\r

      \    pm.expect(json.totalItems).to.exist;\r

      \    pm.expect(json.totalPages).to.exist;\r

      });\r"
    language: text/javascript
order: 1000
