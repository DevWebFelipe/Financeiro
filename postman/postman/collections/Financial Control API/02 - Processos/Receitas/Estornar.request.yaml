$kind: http-request
description: Desfaz o recebimento. Não cancela a duplicata.
url: "{{baseUrl}}/api/v1/incomes/{{incomeId}}/reverse"
method: POST
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Status deve voltar para EXPECTED\", function () {\r

      \    pm.expect(json.status).to.eql(\"EXPECTED\");\r

      });\r"
    language: text/javascript
order: 6000
