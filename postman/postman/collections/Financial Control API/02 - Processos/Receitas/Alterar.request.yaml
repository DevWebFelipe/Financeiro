$kind: http-request
url: "{{baseUrl}}/api/v1/incomes/{{incomeId}}"
method: PUT
body:
  type: json
  content: "{\r

    \  \"categoryId\": \"{{incomeCategoryId}}\",\r

    \  \"description\": \"Salário revisado\",\r

    \  \"amount\": 100.00,\r

    \  \"expectedDate\": \"{{today}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      \r

      pm.test(\"Status deve ser 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"ID da receita deve corresponder ao solicitado\", function () {\r

      \    pm.expect(json.id).to.eql(pm.environment.get(\"incomeId\"));\r

      });\r

      pm.test(\"Receita deve possuir descrição\", function () {\r

      \    pm.expect(json.description).to.exist;\r

      });\r"
    language: text/javascript
order: 4000
