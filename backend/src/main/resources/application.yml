spring:
  application:
    name: financial-control
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/financial_control}
    username: ${DATABASE_USERNAME:financial_control}
    password: ${DATABASE_PASSWORD:financial_control_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${APP_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
