<main>
  <h1>Criar conta</h1>
  <p>Cadastro sem sessão automática. Depois do sucesso, entre com e-mail e senha.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="name">Nome</label>
    <input id="name" type="text" formControlName="name" autocomplete="name" />

    <label for="email">E-mail</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />

    <label for="password">Senha</label>
    <input id="password" type="password" formControlName="password" autocomplete="new-password" />

    @if (error(); as apiError) {
      <app-error-state [message]="apiError.message" />
    }

    <button type="submit" [disabled]="submitting()">Cadastrar</button>
  </form>

  <p><a routerLink="/login">Já tenho conta</a></p>
</main>
