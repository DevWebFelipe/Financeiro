<nav [attr.id]="navId()" aria-label="Principal">
  <ul>
    @for (item of items; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          [attr.title]="collapsed() ? item.label : null"
          (click)="onNavigate()"
        >
          <span class="nav-icon" aria-hidden="true">
            @switch (item.id) {
              @case ('dashboard') {
                <svg viewBox="0 0 24 24" focusable="false">
                  <path
                    fill="currentColor"
                    d="M3.75 3.75h7.5v7.5h-7.5zm9 0h7.5v4.5h-7.5zm0 6h7.5v10.5h-7.5zm-9 3h7.5v7.5h-7.5z"
                  />
                </svg>
              }
              @case ('accounts') {
                <svg viewBox="0 0 24 24" focusable="false">
                  <path
                    fill="currentColor"
                    d="M4.5 19.5h15v1.5h-15zm.75-12L12 3l6.75 4.5H5.25zM6 9h1.5v7.5H6zm3.75 0h1.5v7.5h-1.5zm3.75 0H15v7.5h-1.5zm3.75 0H18.75v7.5H16.5z"
                  />
                </svg>
              }
            }
          </span>
          <span [class.visually-hidden]="collapsed()">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
